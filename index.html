<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Gemini Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: bitta ustun. Tepada panel, o'rtada xabarlar, pastda yozish paneli. Chatlar chap tortmada. */
  --bg: #f4f5f8;
  --surface: #ffffff;
  --ink: #15181f;
  --muted: #5b6372;
  --line: #dcdfe6;
  --accent: #2b47d0;
  --on-accent: #ffffff;
  --claude: #0b7a68;
  --danger: #bf3329;
  --code: #eceef3;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --surface: #171a21; --ink: #e7e9ee; --muted: #98a0ae; --line: #272c36;
    --accent: #8196ff; --on-accent: #0f1115; --claude: #3cc3aa; --danger: #ff7a6c; --code: #1f232c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--sans);
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { width: 100%; max-width: 760px; margin: 0 auto;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

header.top { flex: none; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); }
header.top .wrap { display: flex; align-items: center; gap: 6px; min-height: 52px; }
.ibtn { flex: none; min-width: 44px; height: 44px; border: 0; background: none; border-radius: 8px;
  font: 500 13px var(--mono); color: var(--ink); padding: 0 10px; }
.ibtn:hover { background: var(--bg); }
.ibtn.primary { color: var(--accent); }
#title { flex: 1; min-width: 0; text-align: left; border: 0; background: none; font: 600 16px var(--sans);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 8px 6px; border-radius: 8px; }
#titleEdit { flex: 1; min-width: 0; font: 600 16px var(--sans); padding: 8px; border: 1px solid var(--accent);
  border-radius: 8px; background: var(--bg); }

.banner { flex: none; background: var(--accent); color: var(--on-accent); }
.banner .wrap { display: flex; align-items: center; gap: 10px; padding-top: 8px; padding-bottom: 8px; font-size: 14px; }
.banner span { flex: 1; min-width: 0; }
.banner button { border: 0; border-radius: 8px; padding: 8px 12px; font: 500 13px var(--mono);
  background: var(--on-accent); color: var(--accent); }

main#msgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
main#msgs .wrap { padding-top: 16px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 22px; }

.msg { min-width: 0; }
.msg.user { background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-left: 8%; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: 400 12px var(--mono); color: var(--muted); margin-bottom: 6px; }
.who { font-weight: 500; letter-spacing: .06em; color: var(--ink); }
.msg.model .who { color: var(--accent); }
.msg.by-claude .who { color: var(--claude); }
.tag { border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; font-size: 11px; }
.tag.wait { color: var(--accent); border-color: var(--accent); }
.body { overflow-wrap: anywhere; min-width: 0; }
.body.plain { white-space: pre-wrap; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: .7em 0; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.1em 0 .4em; }
.md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3, .md h4 { font-size: 1.05em; }
.md a { color: var(--accent); }
.md code { font: 400 .9em var(--mono); background: var(--code); border-radius: 4px; padding: .1em .35em; }
.md pre { position: relative; background: var(--code); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
.md pre .cpy { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 6px; padding: 4px 8px;
  font: 500 11px var(--mono); background: var(--surface); color: var(--muted); }
.md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
.md table { display: block; overflow-x: auto; border-collapse: collapse; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
.acts { display: flex; flex-wrap: wrap; gap: 2px; margin: 8px -8px 0; }
.acts button { border: 0; background: none; color: var(--muted); font: 500 12px var(--mono); padding: 9px 8px; border-radius: 6px; }
.acts button:hover { background: var(--bg); color: var(--ink); }
.acts button.warn { color: var(--danger); }
.acts button.go { color: var(--accent); }
details.prev { margin-top: 8px; font-size: 14px; color: var(--muted); }
details.prev summary { cursor: pointer; font: 400 12px var(--mono); }
details.prev .old { white-space: pre-wrap; border-left: 3px solid var(--line); padding-left: 10px; margin: 8px 0; }
.editbox { width: 100%; min-height: 120px; max-height: 50vh; resize: vertical; padding: 10px; border-radius: 8px;
  border: 1px solid var(--accent); background: var(--bg); line-height: 1.5; }
.thinking { font: 400 13px var(--mono); color: var(--muted); }
.empty, .onboard { color: var(--muted); font-size: 15px; }
.onboard h2 { color: var(--ink); font-size: 18px; margin: 0 0 8px; }
.onboard ol { padding-left: 20px; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font: 500 14px var(--sans); background: var(--accent); color: var(--on-accent); }
.btn.alt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

footer.composer { flex: none; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
footer.composer .wrap { padding-top: 10px; padding-bottom: 10px; }
.row { display: flex; align-items: flex-end; gap: 8px; }
#input { flex: 1; min-width: 0; resize: none; max-height: 160px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); line-height: 1.45; }
#send { height: 44px; padding: 0 18px; flex: none; }
#send:disabled { opacity: .5; }
.chip { margin-top: 6px; border: 0; background: none; padding: 4px 0; font: 400 12px var(--mono); color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px;
  font-size: 14px; z-index: 40; overflow-wrap: anywhere; max-height: 35vh; overflow-y: auto; }
.toast.err { background: var(--danger); color: #fff; }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.drawer, .sheet { position: fixed; z-index: 30; background: var(--surface); }
.drawer { top: 0; bottom: 0; left: 0; width: min(88vw, 340px); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
.drawer h2, .sheet h2 { font: 600 15px var(--sans); margin: 0; }
.drawer .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; gap: 8px; }
.drawer ul { list-style: none; margin: 0; padding: 0 6px 12px; overflow-y: auto; flex: 1; }
.drawer li { display: flex; align-items: center; border-radius: 8px; }
.drawer li.cur { background: var(--bg); }
.drawer li .pick { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 10px 8px; }
.drawer li .t { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer li .s { display: block; font: 400 12px var(--mono); color: var(--muted); }
.drawer li .x { border: 0; background: none; color: var(--muted); font: 500 12px var(--mono); padding: 12px 10px; border-radius: 6px; }
.drawer li .x.arm { color: var(--danger); }
.sheet { left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 560px; transform: translateX(-50%); } }
.sheet label { display: block; font: 500 12px var(--mono); color: var(--muted); margin: 14px 0 4px; }
.sheet input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.sheet .help { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.sheet .help a { color: var(--accent); }
.sheet .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.modelbtn { width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); font: 400 14px var(--mono); overflow-wrap: anywhere; }
.picker { display: flex; flex-direction: column; height: min(86dvh, 760px); }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.picker input { margin-bottom: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chips button { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 7px 12px; font: 500 12px var(--mono); color: var(--muted); }
.chips button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.plist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
.plist li { display: flex; align-items: flex-start; border-radius: 8px; }
.plist li.cur { background: var(--bg); }
.plist .pick { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 10px 8px; }
.plist .t { display: block; font-weight: 500; overflow-wrap: anywhere; }
.plist .id { display: block; font: 400 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.plist .m2 { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 5px; align-items: center; }
.plist .x { flex: none; border: 0; background: none; color: var(--accent); font: 500 12px var(--mono); padding: 12px 10px; border-radius: 6px; }
.plist .note { padding: 12px 8px; color: var(--muted); font-size: 14px; }
.st { font: 400 12px var(--mono); } .st.ok { color: var(--claude); } .st.bad { color: var(--danger); }
.tag.warn { color: var(--danger); border-color: var(--danger); }
.tag.cur { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <button class="ibtn" id="btnList" aria-label="Chatlar">Chatlar</button>
  <button id="title" aria-label="Chat nomini o'zgartirish">Gemini Chat</button>
  <button class="ibtn primary" id="btnSync" aria-label="Yangilash">Sync</button>
  <button class="ibtn" id="btnSettings" aria-label="Sozlamalar">Sozlama</button>
</div></header>

<div class="banner" id="banner" hidden><div class="wrap"><span id="bannerText"></span><button id="bannerBtn">Javob olish</button></div></div>

<main id="msgs"><div class="wrap" id="msgsInner"></div></main>

<footer class="composer"><div class="wrap">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Gemini'ga yozing…" aria-label="Xabar"></textarea>
    <button class="btn" id="send">Yuborish</button>
  </div>
  <button class="chip" id="modelChip">model: tanlanmagan</button>
</div></footer>

<div class="toast" id="toast" hidden></div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="head"><h2>Chatlar</h2><button class="btn" id="btnNew">Yangi chat</button></div>
  <ul id="chatList"></ul>
</aside>

<section class="sheet" id="settings" hidden>
  <h2>Sozlamalar</h2>
  <label for="s-gkey">GEMINI API KEY</label>
  <input id="s-gkey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p class="help"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> sahifasida yaratiladi. Faqat shu telefonning brauzerida saqlanadi.</p>

  <label>MODEL</label>
  <button class="modelbtn" id="s-modelBtn" type="button"></button>

  <label for="s-gh">GITHUB TOKEN</label>
  <input id="s-gh" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p class="help"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained token</a>: Repository access = faqat chatlar repo'si, Permissions → Contents = Read and write.</p>

  <label for="s-repo">CHATLAR REPO'SI (egasi/nomi)</label>
  <input id="s-repo" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="s-branch">BRANCH</label>
  <input id="s-branch" autocomplete="off" autocapitalize="off" spellcheck="false">

  <div class="actions"><button class="btn" id="btnSave">Saqlash</button><button class="btn alt" id="btnClose">Yopish</button></div>
</section>

<section class="sheet picker" id="picker" hidden>
  <div class="phead"><h2>Model tanlash</h2><button class="btn alt" id="p-reload">Yangilash</button></div>
  <input id="p-q" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Qidirish yoki model nomini yozing">
  <div class="chips" id="p-chips">
    <button data-k="text">Matn</button><button data-k="image">Rasm</button><button data-k="audio">Ovoz va boshqa</button><button data-k="all">Hammasi</button>
  </div>
  <ul class="plist" id="p-list"></ul>
  <div class="actions"><button class="btn alt" id="p-close">Yopish</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
<script>
"use strict";
/* ---------- yordamchilar ---------- */
const $ = s => document.querySelector(s);
const LS = {
  get(k) { try { return localStorage.getItem("gc_" + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("gc_" + k, v); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const p2 = n => String(n).padStart(2, "0");
const fmt = ts => { const d = new Date(ts); return p2(d.getDate()) + "." + p2(d.getMonth() + 1) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const enc = s => { const b = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));

const cfg = {
  gkey: LS.get("gkey") || "",
  ghtoken: LS.get("ghtoken") || "",
  repo: LS.get("repo") || "umarvibe-coder/gemini-chat-data",
  branch: LS.get("branch") || "main",
  model: LS.get("model") || ""
};
const state = {
  chats: new Map(),            // id -> {chat, sha}
  cur: null, draft: false, busy: false, thinking: null, editing: null,
  armed: null, loaded: false,
  models: (() => { try { return JSON.parse(LS.get("models") || "[]").map(x => typeof x === "string" ? { id: x, name: x } : x); } catch (e) { return []; } })(),
  tests: (() => { try { return JSON.parse(LS.get("tests") || "{}"); } catch (e) { return {}; } })(),
  pickKind: "text", pickFrom: null, testing: null
};
const canRead = () => !!(cfg.ghtoken && cfg.repo);
const canGen = () => !!(cfg.gkey && cfg.model);

function toast(msg, kind) {
  const t = $("#toast");
  clearTimeout(toast._t);
  if (!msg) { t.hidden = true; return; }
  if (msg.length > 220) msg = msg.slice(0, 220) + "…";
  t.textContent = msg; t.className = "toast" + (kind ? " " + kind : ""); t.hidden = false;
  if (kind !== "err") toast._t = setTimeout(() => { t.hidden = true; }, 3000);
}
$("#toast").addEventListener("click", () => { $("#toast").hidden = true; });

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("Nusxalandi"); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Nusxalandi"); } catch (_) { toast("Nusxalab bo'lmadi", "err"); }
    ta.remove();
  }
}

if (window.DOMPurify) {
  DOMPurify.addHook("afterSanitizeAttributes", n => {
    if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); }
  });
}
function md(t) {
  try {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(t, { gfm: true, breaks: true }));
  } catch (e) {}
  return "<p>" + esc(t).replace(/\n/g, "<br>") + "</p>";
}

/* ---------- GitHub (chatlar repo'si) ---------- */
async function gh(method, path, body) {
  const url = "https://api.github.com/repos/" + cfg.repo + "/contents/" + path + (method === "GET" ? "?ref=" + encodeURIComponent(cfg.branch) : "");
  const headers = { Authorization: "Bearer " + cfg.ghtoken, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (body) headers["Content-Type"] = "application/json";
  let r;
  try { r = await fetch(url, { method, headers, cache: "no-store", body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { const err = new Error("GitHub'ga ulanib bo'lmadi (internet?)"); err.status = 0; throw err; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error("GitHub " + r.status + ": " + (j.message || "xato"));
    err.status = r.status; throw err;
  }
  return j;
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { await fn(items[i++]); } }));
}
async function fetchChat(name) {
  const id = name.replace(/\.json$/, "");
  const j = await gh("GET", "chats/" + name);
  try {
    const chat = JSON.parse(dec(j.content));
    if (!Array.isArray(chat.messages)) throw new Error("messages yo'q");
    chat.id = id;
    return { chat, sha: j.sha };
  } catch (e) {
    return { chat: { id, title: id + " (o'qib bo'lmadi)", messages: [], broken: true, created: 0, updated: 0 }, sha: j.sha };
  }
}
async function refreshAll() {
  let items;
  try { items = await gh("GET", "chats"); } catch (e) { if (e.status === 404) items = []; else throw e; }
  const files = items.filter(x => x.type === "file" && x.name.endsWith(".json"));
  const next = new Map();
  await pool(files, 6, async f => {
    const id = f.name.replace(/\.json$/, "");
    const old = state.chats.get(id);
    next.set(id, old && old.sha === f.sha ? old : await fetchChat(f.name));
  });
  state.chats = next;
  state.loaded = true;
  if (!state.chats.has(state.cur)) {
    const saved = LS.get("cur");
    state.cur = state.draft ? null : (state.chats.has(saved) ? saved : (sortedChats()[0] || {}).id || null);
  }
}
async function refreshOne(id) { state.chats.set(id, await fetchChat(id + ".json")); }

async function mutate(id, fn) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const e = state.chats.get(id);
    if (!e) throw new Error("Chat topilmadi (o'chirilgan bo'lishi mumkin)");
    if (e.chat.broken) throw new Error("Bu chat fayli buzilgan (JSON xato), tahrirlab bo'lmaydi");
    const chat = structuredClone(e.chat);
    fn(chat);
    chat.updated = Date.now();
    try {
      const res = await gh("PUT", "chats/" + id + ".json", {
        message: "chat " + id, content: enc(JSON.stringify(chat, null, 1) + "\n"), sha: e.sha, branch: cfg.branch
      });
      state.chats.set(id, { chat, sha: res.content.sha });
      return chat;
    } catch (err) {
      if (err.status === 409 || err.status === 422) { await refreshOne(id); continue; }
      throw err;
    }
  }
  throw new Error("Saqlab bo'lmadi: chat tez-tez o'zgaryapti. Sync bosib qayta urinib ko'ring.");
}
async function createChat() {
  const d = new Date();
  const id = d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) + "-" + uid().slice(0, 4);
  const chat = { id, title: "Yangi chat", created: Date.now(), updated: Date.now(), messages: [] };
  const res = await gh("PUT", "chats/" + id + ".json", { message: "new chat " + id, content: enc(JSON.stringify(chat, null, 1) + "\n"), branch: cfg.branch });
  state.chats.set(id, { chat, sha: res.content.sha });
  state.cur = id; state.draft = false; LS.set("cur", id);
  return id;
}

/* ---------- Gemini ---------- */
async function gemini(chat, upto) {
  const contents = chat.messages.slice(0, upto + 1)
    .filter(m => m.text && m.text.trim())
    .map(m => ({ role: m.role === "user" ? "user" : "model", parts: [{ text: m.text }] }));
  let r;
  try {
    r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(cfg.model) + ":generateContent", {
      method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": cfg.gkey }, body: JSON.stringify({ contents })
    });
  } catch (e) { throw new Error("Gemini'ga ulanib bo'lmadi (internet?)"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error("Gemini " + r.status + ": " + ((j.error && j.error.message) || "xato"));
  const c = j.candidates && j.candidates[0];
  const text = ((c && c.content && c.content.parts) || []).map(p => p.text || "").join("");
  if (!text) {
    const why = (c && c.finishReason) || (j.promptFeedback && j.promptFeedback.blockReason) || "";
    throw new Error("Gemini bo'sh javob qaytardi" + (why ? " (" + why + ")" : ""));
  }
  return text;
}
async function loadModels() {
  if (!cfg.gkey) { toast("Avval Gemini key kiriting", "err"); return; }
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": cfg.gkey } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error("Gemini " + r.status + ": " + ((j.error && j.error.message) || "xato"));
  state.models = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => ({ id: m.name.replace(/^models\//, ""), name: m.displayName || m.name.replace(/^models\//, ""), inTok: m.inputTokenLimit }));
  LS.set("models", JSON.stringify(state.models));
  renderPicker();
  toast(state.models.length + " ta model topildi");
}

/* ---------- amallar ---------- */
function sortedChats() { return [...state.chats.values()].map(e => e.chat).sort((a, b) => (b.updated || 0) - (a.updated || 0)); }
function curChat() { const e = state.chats.get(state.cur); return e ? e.chat : null; }
function pendings() {
  const out = [];
  for (const [cid, e] of state.chats) for (const m of e.chat.messages) if (m.role === "user" && m.pending) out.push([cid, m.id]);
  return out;
}
async function withBusy(fn) {
  if (state.busy) { toast("Biroz kuting…"); return; }
  state.busy = true; render();
  try { await fn(); }
  catch (e) { toast(e.message || String(e), "err"); }
  finally { state.busy = false; state.thinking = null; render(); }
}
async function answerOne(chatId, msgId) {
  const e = state.chats.get(chatId);
  const idx = e.chat.messages.findIndex(m => m.id === msgId);
  if (idx < 0) return;
  state.thinking = chatId; render();
  const text = await gemini(e.chat, idx);
  await mutate(chatId, c => {
    const i = c.messages.findIndex(m => m.id === msgId);
    if (i < 0) return;
    delete c.messages[i].pending;
    c.messages.splice(i + 1, 0, { id: uid(), role: "model", by: "gemini", model: cfg.model, text, ts: Date.now() });
  });
  state.thinking = null; render(); scrollEnd();
}
async function runPendings() {
  if (!canGen()) { toast("Gemini key va modelni sozlang", "err"); return; }
  for (const [cid, mid] of pendings()) await answerOne(cid, mid);
}
async function send() {
  const ta = $("#input"); const text = ta.value.trim();
  if (!text) return;
  if (!canRead()) { openSettings(); return; }
  if (!canGen()) { toast("Avval Gemini key va modelni sozlang", "err"); openSettings(); return; }
  await withBusy(async () => {
    let id = state.cur;
    if (!id) id = await createChat();
    const mid = uid();
    await mutate(id, c => {
      c.messages.push({ id: mid, role: "user", by: "me", text, ts: Date.now(), pending: true });
      if (!c.title || c.title === "Yangi chat") c.title = text.replace(/\s+/g, " ").slice(0, 40);
    });
    ta.value = ""; autosize(); render(); scrollEnd();
    await answerOne(id, mid);
  });
}
async function regenerate(id) {
  if (!canGen()) { toast("Gemini key va modelni sozlang", "err"); return; }
  await withBusy(async () => {
    const chat = curChat(); const ms = chat.messages;
    const i = ms.findIndex(m => m.id === id);
    let j = i - 1; while (j >= 0 && ms[j].role !== "user") j--;
    if (j < 0) throw new Error("Bu javobning savoli topilmadi");
    state.thinking = chat.id; render();
    const text = await gemini(chat, j);
    await mutate(chat.id, c => {
      const m = c.messages.find(x => x.id === id); if (!m) return;
      (m.prev = m.prev || []).push(m.text);
      m.text = text; m.model = cfg.model; m.ts = Date.now(); delete m.edited;
    });
  });
}
async function syncNow() {
  if (!canRead()) { openSettings(); return; }
  await withBusy(async () => {
    toast("Yangilanmoqda…");
    await refreshAll(); render();
    toast("");
    if (pendings().length && canGen()) await runPendings();
    else toast("Yangilandi");
  });
}
async function deleteChat(id) {
  await withBusy(async () => {
    const e = state.chats.get(id);
    await gh("DELETE", "chats/" + id + ".json", { message: "delete chat " + id, sha: e.sha, branch: cfg.branch });
    state.chats.delete(id);
    if (state.cur === id) state.cur = (sortedChats()[0] || {}).id || null;
  });
}

/* ---------- ko'rinish ---------- */
function msgHtml(m) {
  const isU = m.role === "user";
  const who = isU ? (m.by === "claude" ? "CLAUDE" : "MEN") : "GEMINI";
  const sub = [m.model, m.ts ? fmt(m.ts) : ""].filter(Boolean).join(" · ");
  let tags = "";
  if (m.edited) tags += '<span class="tag">tahrirlangan</span>';
  if (m.pending) tags += '<span class="tag wait">javob kutmoqda</span>';
  let body;
  if (state.editing === m.id) {
    body = '<textarea class="editbox" id="editbox">' + esc(m.text) + "</textarea>";
  } else {
    body = isU ? '<div class="body plain">' + esc(m.text) + "</div>" : '<div class="body md">' + md(m.text) + "</div>";
  }
  let acts;
  if (state.editing === m.id) {
    acts = '<button class="go" data-act="save">Saqlash</button><button data-act="cancel">Bekor</button>';
  } else {
    acts = '<button data-act="copy">Nusxa</button><button data-act="edit">Tahrir</button>';
    if (!isU) acts += '<button data-act="regen">Qayta</button>';
    if (isU && m.pending) acts += '<button class="go" data-act="answer">Javob olish</button>';
    acts += '<button class="' + (state.armed === m.id ? "warn" : "") + '" data-act="del">' + (state.armed === m.id ? "Aniqmi?" : "O'chirish") + "</button>";
  }
  let prev = "";
  if (m.prev && m.prev.length) {
    prev = '<details class="prev"><summary>Eski variantlar (' + m.prev.length + ")</summary>" +
      m.prev.map(t => '<div class="old">' + esc(t) + "</div>").join("") + "</details>";
  }
  return '<article class="msg ' + (isU ? "user" : "model") + (m.by === "claude" ? " by-claude" : "") + '" data-id="' + esc(m.id) + '">' +
    '<div class="meta"><span class="who">' + who + "</span><span>" + esc(sub) + "</span>" + tags + "</div>" +
    body + prev + '<div class="acts">' + acts + "</div></article>";
}
function renderMsgs() {
  const box = $("#msgsInner");
  if (!canRead()) {
    box.innerHTML = '<div class="onboard"><h2>Boshlash</h2><ol><li>Sozlamalarda Gemini API key kiriting va modellarni yuklang.</li><li>GitHub token kiriting. Chatlar shu token orqali private repo\'ga yoziladi.</li><li>Sync bosing.</li></ol><button class="btn" data-go="settings">Sozlamalarni ochish</button></div>';
    return;
  }
  const chat = curChat();
  if (!chat) {
    box.innerHTML = '<div class="empty">' + (state.loaded ? "Yangi chat. Birinchi xabaringizni pastga yozing." : "Yuklanmoqda…") + "</div>";
    return;
  }
  let h = chat.messages.map(msgHtml).join("");
  if (!chat.messages.length) h = '<div class="empty">Bu chat bo\'sh.</div>';
  if (state.thinking === chat.id) h += '<div class="thinking">Gemini o\'ylamoqda…</div>';
  box.innerHTML = h;
  box.querySelectorAll(".md pre").forEach(pre => {
    const b = document.createElement("button"); b.className = "cpy"; b.dataset.act = "copycode"; b.textContent = "Nusxa"; pre.appendChild(b);
  });
  if (state.editing) { const ta = $("#editbox"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
}
function renderHeader() {
  const chat = curChat();
  $("#title").textContent = chat ? chat.title : "Yangi chat";
  $("#send").disabled = state.busy;
  $("#btnSync").disabled = state.busy;
  $("#modelChip").textContent = "model: " + (cfg.model || "tanlanmagan");
  const n = pendings().length;
  const bn = $("#banner");
  if (n && !state.busy && canRead()) {
    bn.hidden = false;
    $("#bannerText").textContent = n + " ta savol Gemini javobini kutmoqda";
  } else bn.hidden = true;
}
function renderDrawer() {
  const ul = $("#chatList");
  const list = sortedChats();
  ul.innerHTML = list.length ? list.map(c =>
    '<li class="' + (c.id === state.cur ? "cur" : "") + '" data-id="' + esc(c.id) + '"><button class="pick" data-d="pick"><span class="t">' + esc(c.title || c.id) +
    '</span><span class="s">' + (c.updated ? fmt(c.updated) : "") + " · " + c.messages.length + ' xabar</span></button>' +
    '<button class="x ' + (state.armed === "chat:" + c.id ? "arm" : "") + '" data-d="del">' + (state.armed === "chat:" + c.id ? "Aniqmi?" : "O'chirish") + "</button></li>"
  ).join("") : '<li style="padding:12px;color:var(--muted)">Hali chat yo\'q</li>';
}
function render() {
  if (state.editing) { renderHeader(); renderDrawer(); return renderMsgs(); }
  renderHeader(); renderMsgs(); renderDrawer();
}
function scrollEnd() { const m = $("#msgs"); requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; }); }
function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }

/* ---------- hodisalar ---------- */
$("#msgs").addEventListener("click", async ev => {
  const go = ev.target.closest("[data-go]");
  if (go) { openSettings(); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "copycode") { const c = b.closest("pre").querySelector("code"); copyText(c ? c.innerText : b.closest("pre").innerText); return; }
  const art = b.closest("[data-id]"); const id = art && art.dataset.id;
  const chat = curChat(); const m = chat && chat.messages.find(x => x.id === id);
  if (!m) return;
  if (act === "copy") copyText(m.text);
  else if (act === "edit") { state.editing = id; state.armed = null; render(); }
  else if (act === "cancel") { state.editing = null; render(); }
  else if (act === "save") {
    const text = $("#editbox").value;
    if (!text.trim()) { toast("Matn bo'sh bo'lmasin", "err"); return; }
    state.editing = null;
    await withBusy(async () => { await mutate(chat.id, c => { const x = c.messages.find(y => y.id === id); if (x && x.text !== text) { x.text = text; x.edited = true; } }); });
  }
  else if (act === "del") {
    if (state.armed !== id) { state.armed = id; render(); setTimeout(() => { if (state.armed === id) { state.armed = null; render(); } }, 3000); return; }
    state.armed = null;
    await withBusy(async () => { await mutate(chat.id, c => { c.messages = c.messages.filter(x => x.id !== id); }); });
  }
  else if (act === "regen") regenerate(id);
  else if (act === "answer") {
    if (!canGen()) { toast("Gemini key va modelni sozlang", "err"); return; }
    withBusy(() => answerOne(chat.id, id));
  }
});
$("#send").addEventListener("click", send);
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
$("#btnSync").addEventListener("click", syncNow);
$("#bannerBtn").addEventListener("click", () => withBusy(runPendings));
$("#modelChip").addEventListener("click", () => openPicker());

function openDrawer(on) { $("#drawer").hidden = !on; $("#scrim").hidden = !on && $("#settings").hidden; if (on) renderDrawer(); }
$("#btnList").addEventListener("click", () => openDrawer(true));
$("#scrim").addEventListener("click", () => { $("#drawer").hidden = true; $("#settings").hidden = true; $("#picker").hidden = true; $("#scrim").hidden = true; });
$("#btnNew").addEventListener("click", () => { state.cur = null; state.draft = true; state.editing = null; openDrawer(false); render(); $("#input").focus(); });
$("#chatList").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-d]"); if (!b) return;
  const id = b.closest("li").dataset.id;
  if (b.dataset.d === "pick") { state.cur = id; state.draft = false; state.editing = null; LS.set("cur", id); openDrawer(false); render(); scrollEnd(); }
  else {
    const key = "chat:" + id;
    if (state.armed !== key) { state.armed = key; renderDrawer(); setTimeout(() => { if (state.armed === key) { state.armed = null; renderDrawer(); } }, 3000); return; }
    state.armed = null; await deleteChat(id);
  }
});

/* chat nomini o'zgartirish */
document.querySelector("header.top").addEventListener("click", ev => { if (ev.target.closest("#title")) startRename(); });
function startRename() {
  const chat = curChat(); if (!chat || chat.broken || state.busy) return;
  const inp = document.createElement("input"); inp.id = "titleEdit"; inp.value = chat.title;
  $("#title").replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true;
    const v = inp.value.trim(); const t = document.createElement("button"); t.id = "title"; t.textContent = chat.title; inp.replaceWith(t);
    if (save && v && v !== chat.title) await withBusy(async () => { await mutate(chat.id, c => { c.title = v; }); });
    else render();
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
  inp.addEventListener("blur", () => finish(true));
}

/* sozlamalar */
function openSettings() {
  $("#s-gkey").value = cfg.gkey; $("#s-gh").value = cfg.ghtoken; $("#s-repo").value = cfg.repo;
  $("#s-branch").value = cfg.branch; $("#s-modelBtn").textContent = cfg.model || "Tanlanmagan. Bosib tanlang";
  $("#drawer").hidden = true; $("#picker").hidden = true; $("#settings").hidden = false; $("#scrim").hidden = false;
}
function closeSettings() { $("#settings").hidden = true; $("#scrim").hidden = true; }
$("#btnClose").addEventListener("click", closeSettings);
$("#btnSave").addEventListener("click", async () => {
  cfg.gkey = $("#s-gkey").value.trim(); cfg.ghtoken = $("#s-gh").value.trim();
  cfg.repo = $("#s-repo").value.trim(); cfg.branch = $("#s-branch").value.trim() || "main";
  ["gkey", "ghtoken", "repo", "branch"].forEach(k => LS.set(k, cfg[k]));
  closeSettings(); render();
  if (canRead()) syncNow();
});

/* ---------- model tanlash ---------- */
const kindOf = id => /image/i.test(id) ? "image" : /tts|audio|live|dialog/i.test(id) ? "audio" : /robotics|computer-use|aqa/i.test(id) ? "other" : "text";
const isTrial = id => /preview|exp/i.test(id);
function tagsOf(id) {
  const t = [];
  if (isTrial(id)) t.push("sinov");
  if (/lite/i.test(id)) t.push("yengil"); else if (/flash/i.test(id)) t.push("tez"); else if (/pro/i.test(id)) t.push("kuchli");
  if (/gemma/i.test(id)) t.push("ochiq model");
  return t;
}
const fmtTok = n => !n ? "" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : Math.round(n / 1000) + "K";
function renderPicker() {
  const raw = $("#p-q").value.trim(), q = raw.toLowerCase(), kind = state.pickKind;
  document.querySelectorAll("#p-chips button").forEach(b => b.classList.toggle("on", b.dataset.k === kind));
  const okKind = k => kind === "all" || (kind === "audio" ? (k === "audio" || k === "other") : k === kind);
  const list = state.models.filter(m => okKind(kindOf(m.id)) && (!q || m.id.toLowerCase().includes(q) || (m.name || "").toLowerCase().includes(q)))
    .sort((a, b) => (isTrial(a.id) - isTrial(b.id)) || b.id.localeCompare(a.id, undefined, { numeric: true }));
  let h = "";
  if (raw && !state.models.some(m => m.id.toLowerCase() === q))
    h += '<li data-id="' + esc(raw) + '"><button class="pick" data-p="custom"><span class="t">"' + esc(raw) + '" ni ishlatish</span><span class="id">ro\'yxatda yo\'q, nomi qo\'lda</span></button></li>';
  h += list.map(m => {
    const k = kindOf(m.id), t = state.tests[m.id];
    let tags = tagsOf(m.id).map(x => '<span class="tag">' + x + "</span>").join("");
    if (k !== "text") tags += '<span class="tag warn">matn chat uchun emas</span>';
    if (m.id === cfg.model) tags = '<span class="tag cur">tanlangan</span>' + tags;
    const lim = fmtTok(m.inTok); if (lim) tags += '<span class="st">' + lim + " kontekst</span>";
    let st = "";
    if (t) st = t.ok ? '<span class="st ok">✓ ishladi · ' + fmt(t.ts) + "</span>"
      : '<span class="st bad">✗ ' + (t.code === 429 ? "limit yoki kvota yo'q" : "xato") + (t.msg ? " · " + esc(t.msg) : "") + "</span>";
    return '<li class="' + (m.id === cfg.model ? "cur" : "") + '" data-id="' + esc(m.id) + '"><button class="pick" data-p="pick"><span class="t">' + esc(m.name || m.id) +
      '</span><span class="id">' + esc(m.id) + '</span><span class="m2">' + tags + st + "</span></button>" +
      '<button class="x" data-p="test">' + (state.testing === m.id ? "…" : "Sinash") + "</button></li>";
  }).join("");
  if (!list.length && !raw) h = '<li class="note">' + (state.models.length ? "Bu turda model yo'q. Boshqa turni tanlang." : "Modellar ro'yxati yo'q. Yangilash ni bosing.") + "</li>";
  $("#p-list").innerHTML = h;
}
function openPicker(from) {
  if (!cfg.gkey) { toast("Avval Gemini key kiriting", "err"); openSettings(); return; }
  state.pickFrom = from || null;
  $("#drawer").hidden = true; $("#settings").hidden = true; $("#picker").hidden = false; $("#scrim").hidden = false;
  if (!state.models.length) loadModels().catch(e => toast(e.message, "err"));
  renderPicker();
}
function closePicker() {
  $("#picker").hidden = true; $("#scrim").hidden = true;
  if (state.pickFrom === "settings") openSettings();
}
function pickModel(id) {
  cfg.model = id; LS.set("model", id);
  const warn = kindOf(id) !== "text";
  closePicker(); render();
  toast(warn ? "Model: " + id + ". Bu matn chat uchun emas, javob bo'sh chiqishi mumkin." : "Model: " + id);
}
async function runTest(id) {
  state.testing = id; renderPicker();
  try {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(id) + ":generateContent", {
      method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": cfg.gkey },
      body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "ok" }] }], generationConfig: { maxOutputTokens: 16 } })
    });
    const j = await r.json().catch(() => ({}));
    state.tests[id] = r.ok ? { ok: true, ts: Date.now() }
      : { ok: false, ts: Date.now(), code: r.status, msg: String((j.error && j.error.message) || "HTTP " + r.status).slice(0, 90) };
  } catch (e) { state.tests[id] = { ok: false, ts: Date.now(), code: 0, msg: "ulanib bo'lmadi" }; }
  LS.set("tests", JSON.stringify(state.tests));
  state.testing = null; renderPicker();
}
$("#s-modelBtn").addEventListener("click", () => { cfg.gkey = $("#s-gkey").value.trim(); LS.set("gkey", cfg.gkey); openPicker("settings"); });
$("#p-close").addEventListener("click", closePicker);
$("#p-reload").addEventListener("click", () => loadModels().catch(e => toast(e.message, "err")));
$("#p-q").addEventListener("input", renderPicker);
$("#p-chips").addEventListener("click", ev => { const b = ev.target.closest("[data-k]"); if (b) { state.pickKind = b.dataset.k; renderPicker(); } });
$("#p-list").addEventListener("click", ev => {
  const b = ev.target.closest("[data-p]"); if (!b) return;
  const id = b.closest("li").dataset.id;
  if (b.dataset.p === "test") runTest(id); else pickModel(id);
});

/* ---------- boshlash ---------- */
render(); autosize();
if (canRead()) {
  withBusy(async () => { await refreshAll(); }).then(() => { render(); scrollEnd(); });
}
</script>
